name: Kiểm tra Dreamers
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:rules
      - run: npx firebase emulators:exec --only firestore --project demo-pq "node tests/emulator/phan-quyen.rules.test.mjs"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-chromium --project=mobile-chromium --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dreamers-test-report
          path: playwright-report/
