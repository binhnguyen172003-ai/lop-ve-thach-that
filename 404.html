<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Không tìm thấy trang · Lớp Vẽ Không Vui</title>
<link rel="icon" type="image/png" href="/lop-ve-thach-that/assets/img/favicon-b1.png">
<style>
  :root{--paper:#f4f5f2;--sheet:#fff;--ink:#1f2226;--graphite:#5b6068;--accent:#2c43b0;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--paper:#15171b;--sheet:#1d2025;--ink:#eceef1;--graphite:#a3a8b1;--accent:#93a5ff;color-scheme:dark}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px}
  main{max-width:420px;text-align:center;background:var(--sheet);border-radius:16px;padding:32px 24px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:var(--graphite);margin:0 0 20px}
  a{display:inline-block;background:var(--accent);color:var(--paper);text-decoration:none;font-weight:600;padding:10px 20px;border-radius:999px}
</style>
</head>
<body>
<main>
  <h1>Trang này không có hoặc đã đổi chỗ</h1>
  <p>Web tự đưa bạn về trang chủ sau <b id="dem">5</b> giây.</p>
  <a id="ve" href="/lop-ve-thach-that/">Về trang chủ ngay</a>
</main>
<script>
// Link cũ dạng /lop-ve-thach-that/bai-tap → mở thẳng mục #bai-tap trên trang chủ.
var goc = "/lop-ve-thach-that/";
var muc = location.pathname.replace(/\/+$/, "").split("/").pop();
var dich = goc + (/^(gioi-thieu|giao-vien|lich-hoc|lich-thi|dang-ky|giao-trinh|bai-tap|tai-khoan|duyet|diem-danh|lam-viec)$/.test(muc) ? "#" + muc : "");
document.getElementById("ve").href = dich;
var n = 5, el = document.getElementById("dem");
setInterval(function () { n--; if (n <= 0) location.replace(dich); else el.textContent = n; }, 1000);
</script>
</body>
</html>
